<!DOCTYPE html>
<html>
  <head>
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  <!-- Animation mixer for playing glTF skeletal animations -->
  <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@6.1.1/dist/aframe-extras.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/mrdoob/three.js@r145/examples/js/loaders/GLTFLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/aframe-animation-mixer@6.0.0/dist/aframe-animation-mixer.min.js"></script>
  </head>

  <body style="margin: 0; overflow: hidden;">
    <a-scene
      embedded
      arjs="sourceType: webcam; detectionMode: mono; matrixCodeType: 3x3;"
    >
      <!-- Custom pattern marker: uses local marker.patt and marker.png (image for printing/preview) -->
      <a-marker type="pattern" url="./pattern-images-1.patt">
            <!-- glTF model entity. Adjust scale/position/rotation if needed -->
            <a-entity
              gltf-model="url(./Scene_1.glb)"
              scale="0.5 0.5 0.5"
              position="0 0 0"
              rotation="0 0 0"
              animation-mixer
            ></a-entity>
      </a-marker>
      <!-- Custom pattern marker: uses local marker.patt and marker.png (image for printing/preview) -->
      <a-marker type="pattern" url="./pattern-images-2.patt">
            <!-- glTF model entity. Adjust scale/position/rotation if needed -->
            <a-entity
              gltf-model="url(./Scene_2.glb)"
              scale="0.5 0.5 0.5"
              position="0 0 0"
              rotation="0 0 0"
              animation-mixer
            ></a-entity>
      </a-marker>
      <!-- Custom pattern marker: uses local marker.patt and marker.png (image for printing/preview) -->
      <a-marker type="pattern" url="./pattern-images-3.patt">
            <!-- glTF model entity. Adjust scale/position/rotation if needed -->
            <a-entity
              gltf-model="url(./Scene_3.glb)"
              scale="0.5 0.5 0.5"
              position="0 0 0"
              rotation="0 0 0"
              animation-mixer
            ></a-entity>
      </a-marker>
      <a-marker type="pattern" url="./marker.patt">
            <!-- glTF model entity. Adjust scale/position/rotation if needed -->
            <a-entity
              gltf-model="url(./Scene_4.glb)"
              scale="0.1 0.1 0.1"
              position="0 0 0"
              rotation="0 0 0"
              animation-mixer
            ></a-entity>
      </a-marker>
      <!-- Custom pattern marker: uses local marker.patt and marker.png (image for printing/preview) -->
      <a-marker type="pattern" url="./pattern-silksong.patt">
            <!-- glTF model entity. Adjust scale/position/rotation if needed -->
            <a-entity
              gltf-model="url(./Scene_5.glb)"
              scale="0.5 0.5 0.5"
              position="0 0 0"
              rotation="0 0 0"
              animation-mixer
            ></a-entity>
      </a-marker>
      <a-entity camera></a-entity>
    </a-scene>
  </body>
</html>
