<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Custom AR.js Marker</title>

    <!-- A-Frame -->
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

    <!-- AR.js for A-Frame -->
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

    <style>
      body, html {
        margin: 0;
        overflow: hidden;
      }
    </style>
  </head>

  <body>
    <!-- AR Scene -->
    <a-scene
      embedded
      arjs="sourceType: webcam; detectionMode: mono; matrixCodeType: 3x3;"
    >
      <!-- YOUR CUSTOM MARKER -->
      <!-- Make sure marker.patt is in the same folder as this HTML file -->
      <a-marker type="pattern" url="./marker.patt">
        
        <!-- YOUR MODEL -->
        <!-- Replace model.glb with your actual filename -->
        <a-gltf-model
          src="./model.glb"
          position="0 0 0"
          rotation="0 0 0"
          scale="0.2 0.2 0.2"
        ></a-gltf-model>

      </a-marker>

      <!-- Camera -->
      <a-entity camera></a-entity>
    </a-scene>
  </body>
</html>
