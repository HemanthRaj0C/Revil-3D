<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>One QR – AR Story</title>

    <!-- A-Frame -->
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

    <!-- AR.js -->
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

    <!-- Animation mixer -->
    <script src="https://cdn.jsdelivr.net/npm/aframe-animation-mixer@6.0.0/dist/aframe-animation-mixer.min.js"></script>

    <style>
      body {
        margin: 0;
        overflow: hidden;
      }
    </style>
  </head>

  <body>
    <a-scene
      embedded
      arjs="sourceType: webcam; detectionMode: mono;"
      renderer="logarithmicDepthBuffer: true;"
    >

      <!-- ONE MARKER (ONE QR) -->
      <a-marker
        id="mainMarker"
        type="pattern"
        url="./marker.patt"
      >
        <!-- MODEL PLACEHOLDER -->
        <a-entity
          id="sceneModel"
          scale="0.5 0.5 0.5"
          position="0 0 0"
          rotation="0 0 0"
          animation-mixer
        ></a-entity>
      </a-marker>

      <!-- CAMERA -->
      <a-entity camera></a-entity>
    </a-scene>

    <!-- SCENE LOGIC -->
    <script>
      // List of scenes (order matters)
      const scenes = [
        "./Scene_1.glb",
        "./Scene_2.glb",
        "./Scene_3.glb",
        "./Scene_4.glb",
        "./Scene_5.glb",
        "./Scene_6.glb"
      ];

      let currentScene = 0;
      let sceneTimer = null;

      const model = document.querySelector("#sceneModel");
      const marker = document.querySelector("#mainMarker");

      function loadScene(index) {
        if (!scenes[index]) return;

        // Unload previous model
        model.removeAttribute("gltf-model");

        // Load new model
        model.setAttribute("gltf-model", scenes[index]);

        console.log("Loaded scene:", scenes[index]);
      }

      function nextScene() {
        if (currentScene < scenes.length - 1) {
          currentScene++;
          loadScene(currentScene);
        } else {
          // Story finished
          clearInterval(sceneTimer);
          console.log("Story complete");
        }
      }

      marker.addEventListener("markerFound", () => {
        console.log("Marker found");

        // Load first scene
        loadScene(currentScene);

        // Start auto scene switching every 8 seconds
        if (!sceneTimer) {
          sceneTimer = setInterval(nextScene, 8000);
        }
      });

      marker.addEventListener("markerLost", () => {
        console.log("Marker lost");

        // Optional: pause when marker is lost
        // clearInterval(sceneTimer);
        // sceneTimer = null;
      });
    </script>
  </body>
</html>
